<!DOCTYPE html>
<html>
<head>
    <title>Bits</title>
    <link rel="stylesheet" href="/stylesheets/output.css">
</head>
<body class="bg-neutral-100 font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto p-4 py-8 text-center">
            <nav> {{template "nav.html"}} </nav>
            <h1 class="text-4xl font-serif font-extrabold text-gray-900 leading-tight mb-8">Bits</h1>
            <ul class="list-none space-y-4 mx-auto">
                {{range .Bits}}
                    <li>
                        <h2><a href="/bits/{{.Slug}}.html" class="text-gray-800 link-underline text-2xl transition duration-300 ease-in-out">{{.Title}}</a></h2>
                    </li>
                {{end}}
            </ul>
        </div>
    </main>

    <footer class="mt-auto">
        {{template "footer.html"}}
    </footer>
</body>
</html>
