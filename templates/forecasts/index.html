<!DOCTYPE html>
<html>
<head>
    <title>Forecasts</title>
    <link rel="stylesheet" href="/stylesheets/output.css">
</head>
<body class="bg-neutral-100 font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-grow">
        <div class="max-w-custom mx-auto p-4 py-8">
            <div class="upper mb-8">
                <nav> {{template "nav.html"}} </nav>
                <h1 class="text-4xl font-serif font-extrabold text-gray-900 leading-tight mb-8 text-center">Forecasts</h1>
                <p class="text-center">I make terrible predictions about the future and gamble on them.</p>
                <hr class="my-8 border-gray-300">
                <!-- Vertical bar -->
                <div class="border-l-2 border-gray-300 pl-4">
                    <ul class="list-none space-y-4 mx-auto mt-8 max-w-lg">
                        {{range .Forecasts}}
                            <li>
                                <h2><a href="/forecasts/{{.Slug}}.html" class="text-gray-800 link-underline text-2xl transition duration-300 ease-in-out">{{.FM.Title}}</a></h2>
                                <span class="block text-sm text-gray-500">{{.FM.DatePublished}}</span>
                            </li>
                        {{end}}
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-auto">
        {{template "footer.html"}}
    </footer>
</body>
</html>
